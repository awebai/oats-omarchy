# A known-good submap in the older hyprlang layout.
bind = SUPER, O, submap, oats
submap = oats, reset
bind = , T, exec, omarchy-launch-or-focus-tui --app-id=org.oats.tui /opt/oats-fixture/oats tui
bind = , O, exec, omarchy-hyprland-window-pop
bind = , escape, submap, reset
bind = , catchall, submap, reset
submap = reset
